<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>Festes de Mallorca - MallorcaGo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap');
body{
    background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('img/fondo.jpg') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    margin: 0;
    padding: 20px;
}
.static-header {
    text-align: center;
    margin-bottom: 20px;
    padding-top: 20px;
}
.logo-main {
    display: inline-flex;
    align-items: baseline;
    font-size: 2.5rem;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2px;
}
.text-mallorca {
    color: #FFD700;
    -webkit-text-stroke: 1.5px black;
    text-shadow: 0 0 15px rgba(255,215,0,0.6);
}
.text-go-container {
    display: inline-flex;
    align-items: center;
}
.text-go {
    color: #FF4500;
    -webkit-text-stroke: 1.5px black;
    text-shadow: 0 0 20px rgba(255,69,0,0.9);
    margin-left: 4px;
}
.simple-arrow {
    width: 32px;
    height: 32px;
    margin-left: 4px;
    filter: drop-shadow(0 0 8px rgba(255,69,0,0.8));
    transform: translateY(2px);
}
.page-title {
    font-size: 1.8rem;
    font-weight: 900;
    color: #FF4500;
    -webkit-text-stroke: 1px black;
    text-shadow: 4px 4px 0 rgba(0,0,0,0.3);
    text-transform: uppercase;
    margin: 10px 0;
}
.settings-icon {
    position: fixed;
    top: 20px;
    right: 20px;
    cursor: pointer;
    background: #f5f5dc;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    border: 2px solid black;
    box-shadow: 0 4px 0 black;
    z-index: 110;
}
.settings-icon:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 black;
}
.settings-modal {
    display: none;
    position: fixed;
    top: 80px;
    right: 20px;
    background: #f5f5dc;
    border: 3px solid black;
    border-radius: 20px;
    padding: 15px;
    z-index: 200;
    width: 200px;
    box-shadow: 0 8px 0 black;
    text-align: center;
}
.settings-modal h3 {
    font-weight: 900;
    margin-bottom: 10px;
}
.lang-option {
    display: block;
    width: 100%;
    background: #FFD700;
    border: 2px solid black;
    border-radius: 30px;
    padding: 5px;
    margin: 5px 0;
    font-weight: bold;
    cursor: pointer;
}
.close-settings {
    margin-top: 10px;
    background: #dc3545;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 4px 12px;
    cursor: pointer;
}
.back-btn {
    background: #FFD700;
    border: 3px solid #000;
    padding: 8px 25px;
    font-weight: 900;
    border-radius: 30px;
    box-shadow: 0 4px 0 #000;
    text-decoration: none;
    color: black;
    display: inline-block;
    margin: 10px auto;
    font-size: 0.9rem;
}
.poetic-desc {
    text-align: center;
    color: #FFD700;
    font-weight: 900;
    -webkit-text-stroke: 0.5px black;
    text-shadow: 1px 1px 0 black;
    margin: 10px auto;
    font-size: 1rem;
    max-width: 500px;
}
.month-selector-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 15px 0 10px;
}
.month-neon-style {
    font-size: 2rem;
    font-weight: 900;
    color: #FF4500;
    -webkit-text-stroke: 1.5px black;
    text-shadow: 0 0 15px rgba(255,69,0,0.8);
    text-transform: uppercase;
    min-width: 220px;
    text-align: center;
}
.arrow-btn {
    font-size: 2rem;
    color: #FFD700;
    -webkit-text-stroke: 1.5px black;
    cursor: pointer;
    user-select: none;
    text-shadow: 2px 2px 0 black;
}
.calendario-container {
    background: #f5f5dc;
    border: 3px solid black;
    border-radius: 20px;
    padding: 15px;
    margin: 0 auto 20px auto;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 8px 0 black;
}
.calendario-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-weight: 900;
    font-size: 0.8rem;
    margin-bottom: 10px;
    color: #d32f2f;
}
.calendario-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
}
.calendario-dia {
    background: white;
    border: 1px solid #ccc;
    border-radius: 12px;
    padding: 8px 4px;
    text-align: center;
    font-weight: bold;
    font-size: 0.9rem;
    cursor: pointer;
    transition: 0.1s;
}
.calendario-dia.has-event {
    background: #d4edda !important;
    border: 2px solid #28a745 !important;
}
.calendario-dia.selected {
    background: #FFD700 !important;
    border: 2px solid black !important;
}
.btn-reset, .btn-order {
    background: black;
    color: #FFD700;
    border: none;
    padding: 6px 12px;
    border-radius: 30px;
    font-weight: bold;
    margin: 10px auto;
    cursor: pointer;
    display: inline-block;
}
.fest-card {
    background: #f5f5dc;
    border: 3px solid #000;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 5px 0 #000;
    width: 100%;
    max-width: 550px;
    position: relative;
    margin: 0 auto;
}
.fest-card .title-stars {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-right: 80px;
    flex-wrap: wrap;
    gap: 5px;
}
.fest-card .pueblo {
    font-size: 22px;
    font-weight: 900;
    color: black;
    margin: 0;
}
.fest-card .stars {
    font-size: 18px;
    white-space: nowrap;
}
.date-badge {
    background: #000;
    color: #fff;
    padding: 2px 10px;
    border-radius: 5px;
    font-size: 0.85rem;
    font-weight: bold;
    margin-top: 8px;
    display: inline-block;
}
.fav-btn, .share-btn {
    position: absolute;
    top: 10px;
    background: #f5f5dc;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    border: 2px solid black;
    box-shadow: 0 2px 0 black;
    z-index: 10;
}
.fav-btn.active {
    color: #e63946;
}
.fav-btn { right: 10px; }
.share-btn { right: 55px; font-size: 18px; }
.status-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid black;
    display: inline-block;
    margin-right: 8px;
}
.dot-green { background: #28a745; }
.dot-yellow { background: #ffc107; }
.dot-red { background: #dc3545; }
.footer-nav {
    text-align: center;
    margin-top: 40px;
    padding-bottom: 30px;
}
.go-top-btn {
    background: #FFD700;
    border: 3px solid #000;
    padding: 8px 25px;
    font-weight: 900;
    border-radius: 30px;
    box-shadow: 0 4px 0 #000;
    color: black;
    cursor: pointer;
    display: inline-block;
    font-size: 0.9rem;
    transition: 0.05s linear;
}
.go-top-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #000;
}
.go-top-btn.hidden {
    display: none;
}
</style>
</head>
<body>

<div class="static-header">
    <div class="logo-main">
        <span class="text-mallorca">Mallorca</span>
        <div class="text-go-container">
            <span class="text-go">Go</span>
            <svg class="simple-arrow" viewBox="0 0 100 100">
                <path d="M20,50 L80,50 M60,30 L80,50 L60,70" fill="none" stroke="black" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20,50 L80,50 M60,30 L80,50 L60,70" fill="none" stroke="#FF4500" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>
    <div class="page-title">FESTES DE LA VILA</div>
</div>

<div class="settings-icon" id="settings-icon">⚙️</div>
<div id="settings-modal" class="settings-modal">
    <h3>Idioma / Language</h3>
    <button class="lang-option" data-lang="es">Español</button>
    <button class="lang-option" data-lang="ca">Català</button>
    <button class="lang-option" data-lang="en">English</button>
    <button class="lang-option" data-lang="de">Deutsch</button>
    <button class="lang-option" data-lang="fr">Français</button>
    <button class="close-settings">Cerrar</button>
</div>

<div style="text-align: center;">
    <a href="index.html" id="btn-back" class="back-btn">← VOLVER</a>
</div>
<div id="poetic-desc" class="poetic-desc">Toca un día para ver sus fiestas</div>

<div class="month-selector-container">
    <div id="prev-btn" class="arrow-btn">❮</div>
    <div id="month-display" class="month-neon-style">Enero 2026</div>
    <div id="next-btn" class="arrow-btn">❯</div>
</div>

<div id="calendario" class="calendario-container"></div>

<div style="text-align: center;">
    <button id="reset-filtro" class="btn-reset">📅 Ver todas</button>
    <button id="order-btn" class="btn-order">📆 Ascendente ⬆️</button>
</div>

<div style="text-align: center; margin: 15px auto;">
    <input type="text" id="buscador-pueblo" placeholder="🔍 Buscar por pueblo (sin tildes, ej. Marratxi)..." style="padding: 8px 15px; border-radius: 30px; border: 2px solid black; width: 80%; max-width: 300px; font-size: 1rem;">
</div>

<main id="fest-container" class="w-full flex flex-col items-center pb-20 px-4"></main>

<div class="footer-nav">
    <button id="go-top" class="go-top-btn hidden">⬆️ Arriba</button>
</div>

<script>
// ======================== FUNCIONES AUXILIARES PARA FECHAS ========================
function getISODate(fechaStr) {
    const match = fechaStr.match(/^\d{4}-\d{2}-\d{2}/);
    return match ? match[0] : null;
}

function parseDate(fechaStr) {
    const iso = getISODate(fechaStr);
    if (!iso) return null;
    const [y, m, d] = iso.split('-');
    return new Date(parseInt(y), parseInt(m)-1, parseInt(d));
}

// ======================== NORMALIZAR TILDES ========================
function normalizeString(str) {
    return str.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/ç/g, "c")
        .replace(/ñ/g, "n");
}

// ======================== VARIABLES GLOBALES ========================
let currentLang = localStorage.getItem('mallorcaLang') || 'es';
let currentMonthIdx = new Date().getMonth();
let currentYear = 2026;
let allFiestas = [];
let favorites = [];
let selectedDate = null;
let ordenAscendente = true;
let filtroPueblo = '';
let modoBusquedaGlobal = false;

const monthsNames = {
    es:["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"],
    ca:["Gener","Febrer","Març","Abril","Maig","Juny","Juliol","Agost","Setembre","Octubre","Novembre","Desembre"],
    en:["January","February","March","April","May","June","July","August","September","October","November","December"],
    de:["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"],
    fr:["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"]
};

const weekDays = {
    es: ["L","M","M","J","V","S","D"],
    ca: ["D","L","M","M","J","V","S"],
    en: ["M","T","W","T","F","S","S"],
    de: ["M","D","M","D","F","S","S"],
    fr: ["L","M","M","J","V","S","D"]
};

const langData = {
    es:{title:"FESTES DE LA VILA",back:"← VOLVER",poetic:"Toca un día para ver sus fiestas",today:"¡HOY!",tomorrow:"¡MAÑANA!",missing:"Faltan",finished:"Finalizado", orderAsc:"Ascendente ⬆️", orderDesc:"Descendente ⬇️"},
    ca:{title:"FESTES DE LA VILA",back:"← TORNAR",poetic:"Toca un dia per veure les seves festes",today:"AVUI!",tomorrow:"DEMÀ!",missing:"Falten",finished:"Finalitzat", orderAsc:"Ascendent ⬆️", orderDesc:"Descendent ⬇️"},
    en:{title:"VILLAGE FESTIVALS",back:"← BACK",poetic:"Tap a day to see its festivals",today:"TODAY!",tomorrow:"TOMORROW!",missing:"Days left:",finished:"Finished", orderAsc:"Ascending ⬆️", orderDesc:"Descending ⬇️"},
    de:{title:"DORFFESTE",back:"← ZURÜCK",poetic:"Tippe auf einen Tag, um seine Feste zu sehen",today:"HEUTE!",tomorrow:"MORGEN!",missing:"Noch",finished:"Beendet", orderAsc:"Aufsteigend ⬆️", orderDesc:"Absteigend ⬇️"},
    fr:{title:"FÊTES DU VILLAGE",back:"← RETOUR",poetic:"Appuyez sur un jour pour voir ses fêtes",today:"AUJOURD'HUI!",tomorrow:"DEMAIN!",missing:"Restant",finished:"Terminé", orderAsc:"Croissant ⬆️", orderDesc:"Décroissant ⬇️"}
};

// ======================== FAVORITOS ========================
function loadFavorites() {
    const stored = localStorage.getItem('mallorcaFavorites');
    favorites = stored ? JSON.parse(stored) : [];
}
function saveFavorites() {
    localStorage.setItem('mallorcaFavorites', JSON.stringify(favorites));
}
function isFavorite(type, id) {
    return favorites.some(f => f.type === type && f.id === id);
}
function getFestId(f) {
    return `fest|||${f.pueblo}|||${f.fecha}|||${f.titulo}`;
}
function toggleFavoriteFromFest(festData, event) {
    event.stopPropagation();
    const id = getFestId(festData);
    if (isFavorite('fest', id)) {
        favorites = favorites.filter(f => !(f.type === 'fest' && f.id === id));
    } else {
        favorites.push({ type: 'fest', id });
    }
    saveFavorites();
    updateFestList();
}

async function shareFest(fest, event) {
    event.stopPropagation();
    const shareData = {
        title: `${fest.pueblo}: ${fest.titulo}`,
        text: `${fest.lugar} - ${fest.descripcion.es.substring(0, 100)}...`,
        url: window.location.origin + '/festes.html'
    };
    if (navigator.share) {
        try { await navigator.share(shareData); } catch (err) {}
    } else {
        await navigator.clipboard.writeText(shareData.url);
        alert('Enlace copiado al portapapeles');
    }
}

// ======================== CALENDARIO ========================
function getDaysInMonth(year, month) { return new Date(year, month+1, 0).getDate(); }
function getFirstDayOfMonth(year, month) { return new Date(year, month, 1).getDay(); }

function buildCalendar(year, month, lang, eventsByDate) {
    const daysInMonth = getDaysInMonth(year, month);
    const firstDay = getFirstDayOfMonth(year, month);
    const weekDaysLocal = weekDays[lang] || weekDays.es;
    let calendarHtml = `<div class="calendario-header">${weekDaysLocal.map(d => `<div>${d}</div>`).join('')}</div><div class="calendario-grid">`;
    for (let i = 0; i < firstDay; i++) { calendarHtml += `<div class="calendario-dia empty"></div>`; }
    for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const hasEvent = eventsByDate.has(dateStr);
        const isSelected = (selectedDate === dateStr);
        let classes = 'calendario-dia';
        if (hasEvent) classes += ' has-event';
        if (isSelected) classes += ' selected';
        calendarHtml += `<div class="${classes}" data-fecha="${dateStr}">${d}</div>`;
    }
    calendarHtml += `</div>`;
    return calendarHtml;
}

function getEventsByMonth(fiestas, year, month) {
    const map = new Map();
    fiestas.forEach(f => {
        const iso = getISODate(f.fecha);
        if (!iso) return;
        const fd = parseDate(f.fecha);
        if (fd && fd.getFullYear() === year && fd.getMonth() === month) {
            if (!map.has(iso)) map.set(iso, []);
            map.get(iso).push(f);
        }
    });
    return map;
}

// ======================== LISTADO DE FIESTAS ========================
function aplicarFiltroPueblo(eventos) {
    if (!filtroPueblo.trim()) return eventos;
    const busquedaNorm = normalizeString(filtroPueblo);
    return eventos.filter(f => normalizeString(f.pueblo).includes(busquedaNorm));
}

function updateFestList() {
    const container = document.getElementById('fest-container');
    const today = new Date(); today.setHours(0,0,0,0);
    let fiestasMostrar = [];

    if (modoBusquedaGlobal) {
        fiestasMostrar = aplicarFiltroPueblo(allFiestas);
    } else {
        if (selectedDate) {
            fiestasMostrar = allFiestas.filter(f => getISODate(f.fecha) === selectedDate);
        } else {
            fiestasMostrar = allFiestas.filter(f => {
                const fd = parseDate(f.fecha);
                return fd && fd.getFullYear() === currentYear && fd.getMonth() === currentMonthIdx;
            });
        }
        fiestasMostrar = aplicarFiltroPueblo(fiestasMostrar);
    }

    if (ordenAscendente) {
        fiestasMostrar.sort((a,b) => parseDate(a.fecha) - parseDate(b.fecha));
    } else {
        fiestasMostrar.sort((a,b) => parseDate(b.fecha) - parseDate(a.fecha));
    }
    if (fiestasMostrar.length === 0) {
        container.innerHTML = '<p style="color:yellow; font-weight:bold; text-align:center;">No hay eventos para esta fecha o filtro.</p>';
        return;
    }
    container.innerHTML = '';
    fiestasMostrar.forEach(f => {
        const start = parseDate(f.fecha);
        let diff = Infinity;
        if (start) diff = Math.ceil((start - today) / (1000*60*60*24));
        let semaforo = "dot-red", textoDias = "";
        if (diff === 0) { semaforo = "dot-green"; textoDias = langData[currentLang].today; }
        else if (diff > 0) { semaforo = (diff <= 7) ? "dot-yellow" : "dot-red"; textoDias = (diff === 1) ? langData[currentLang].tomorrow : `${langData[currentLang].missing} ${diff} d.`; }
        else { textoDias = langData[currentLang].finished; }
        const desc = f.descripcion[currentLang] || f.descripcion.es;
        const id = getFestId(f);
        const favActive = isFavorite('fest', id);
        const iconFav = favActive ? '❤️' : '🤍';
        const stars = '⭐'.repeat(f.ranking || 3);
        const card = `
            <div class="fest-card" style="border-left: 10px solid ${f.color || '#ccc'};">
                <div class="fav-btn ${favActive ? 'active' : ''}" onclick="toggleFavoriteFromFest(${JSON.stringify(f).replace(/"/g, '&quot;')}, event)">${iconFav}</div>
                <div class="share-btn" onclick="shareFest(${JSON.stringify(f).replace(/"/g, '&quot;')}, event)">📤</div>
                <div class="title-stars">
                    <div class="pueblo">${f.pueblo}</div>
                    <div class="stars">${stars}</div>
                </div>
                <p style="color:#e63946; font-weight:bold; margin:5px 0; text-transform:uppercase; font-size:14px; display:flex; align-items:center;">
                    <span class="status-dot ${semaforo}"></span> ${f.titulo} • ${textoDias}
                </p>
                <div style="background:white; border:2px solid black; padding:10px; border-radius:8px; margin:10px 0;">
                    <p style="margin:0; font-size:13px; font-weight:bold;">📍 ${f.lugar}</p>
                    <p style="margin:5px 0 0 0; color:#444; font-style:italic;">"${desc}"</p>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="date-badge">${f.fecha}</span>
                    ${f.pdf && f.pdf !== '#' ? `<a href="${f.pdf}" target="_blank" style="background:#28a745; color:white; text-decoration:none; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:bold; border:2px solid black; box-shadow:2px 2px 0 black;">📄 PROGRAMA</a>` : ''}
                </div>
            </div>
        `;
        container.innerHTML += card;
    });
}

function refreshCalendarAndList() {
    document.getElementById('month-display').innerText = `${monthsNames[currentLang][currentMonthIdx]} ${currentYear}`;
    const eventsByDate = getEventsByMonth(allFiestas, currentYear, currentMonthIdx);
    const calendarHtml = buildCalendar(currentYear, currentMonthIdx, currentLang, eventsByDate);
    document.getElementById('calendario').innerHTML = calendarHtml;
    document.querySelectorAll('.calendario-dia:not(.empty)').forEach(dayDiv => {
        dayDiv.addEventListener('click', (e) => {
            const fecha = dayDiv.dataset.fecha;
            if (fecha) {
                if (selectedDate === fecha) {
                    selectedDate = null;
                    document.querySelectorAll('.calendario-dia').forEach(d => d.classList.remove('selected'));
                } else {
                    document.querySelectorAll('.calendario-dia').forEach(d => d.classList.remove('selected'));
                    dayDiv.classList.add('selected');
                    selectedDate = fecha;
                }
                updateFestList();
            }
        });
    });
    if (selectedDate) {
        const [y,m,d] = selectedDate.split('-');
        if (parseInt(y) !== currentYear || parseInt(m)-1 !== currentMonthIdx) {
            selectedDate = null;
        }
    }
    updateFestList();
}

function changeMonth(delta) {
    let newMonth = currentMonthIdx + delta;
    let newYear = currentYear;
    if (newMonth < 0) { newMonth = 11; newYear--; }
    else if (newMonth > 11) { newMonth = 0; newYear++; }
    if (newYear < 2026) newYear = 2026;
    if (newYear > 2026) newYear = 2026;
    currentMonthIdx = newMonth;
    currentYear = newYear;
    selectedDate = null;
    refreshCalendarAndList();
}

function resetFilter() {
    selectedDate = null;
    filtroPueblo = '';
    modoBusquedaGlobal = false;
    document.getElementById('buscador-pueblo').value = '';
    refreshCalendarAndList();
}

function toggleOrden() {
    ordenAscendente = !ordenAscendente;
    const btn = document.getElementById('order-btn');
    if (ordenAscendente) {
        btn.innerText = `📆 ${langData[currentLang].orderAsc}`;
    } else {
        btn.innerText = `📆 ${langData[currentLang].orderDesc}`;
    }
    updateFestList();
}

// ======================== CARGA DE DATOS (dos archivos) ========================
async function cargarFiestas() {
    try {
        const [res1, res2] = await Promise.all([
            fetch('datos.json'),
            fetch('eventosextra.json')
        ]);
        const fiestasPrincipales = await res1.json();
        const eventosExtra = await res2.json();
        allFiestas = [...fiestasPrincipales, ...eventosExtra];
        refreshCalendarAndList();
    } catch(e) {
        console.error('Error cargando los datos:', e);
        try {
            const res = await fetch('datos.json');
            allFiestas = await res.json();
            refreshCalendarAndList();
        } catch(err) {
            document.getElementById('fest-container').innerHTML = '<p style="color:red; text-align:center;">Error al cargar los datos. Verifica que los archivos datos.json y eventosextra.json existen.</p>';
        }
    }
}

// ======================== INTERFAZ DE IDIOMA ========================
function updateUITexts() {
    document.getElementById('btn-back').innerText = langData[currentLang].back;
    document.getElementById('poetic-desc').innerText = langData[currentLang].poetic;
    const orderBtn = document.getElementById('order-btn');
    if (orderBtn) {
        if (ordenAscendente) orderBtn.innerText = `📆 ${langData[currentLang].orderAsc}`;
        else orderBtn.innerText = `📆 ${langData[currentLang].orderDesc}`;
    }
    refreshCalendarAndList();
}

function changeLang(lang) {
    currentLang = lang;
    localStorage.setItem('mallorcaLang', lang);
    updateUITexts();
}

// ======================== INICIALIZACIÓN ========================
const settingsIcon = document.getElementById('settings-icon');
const settingsModal = document.getElementById('settings-modal');
const closeSettings = document.querySelector('.close-settings');
settingsIcon.addEventListener('click', () => {
    settingsModal.style.display = settingsModal.style.display === 'block' ? 'none' : 'block';
});
closeSettings.addEventListener('click', () => { settingsModal.style.display = 'none'; });
window.addEventListener('click', (e) => { if (e.target === settingsModal) settingsModal.style.display = 'none'; });
document.querySelectorAll('.lang-option').forEach(btn => {
    btn.addEventListener('click', () => {
        changeLang(btn.dataset.lang);
        settingsModal.style.display = 'none';
    });
});

const goTopBtn = document.getElementById('go-top');
window.addEventListener('scroll', () => {
    if (window.scrollY > 300) {
        goTopBtn.classList.remove('hidden');
    } else {
        goTopBtn.classList.add('hidden');
    }
});
goTopBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('prev-btn').addEventListener('click', () => changeMonth(-1));
document.getElementById('next-btn').addEventListener('click', () => changeMonth(1));
document.getElementById('reset-filtro').addEventListener('click', resetFilter);
document.getElementById('order-btn').addEventListener('click', toggleOrden);
document.getElementById('buscador-pueblo').addEventListener('input', (e) => {
    filtroPueblo = e.target.value;
    if (filtroPueblo.trim() !== "") {
        modoBusquedaGlobal = true;
        selectedDate = null;
        document.querySelectorAll('.calendario-dia').forEach(d => d.classList.remove('selected'));
    } else {
        modoBusquedaGlobal = false;
    }
    updateFestList();
});

loadFavorites();
cargarFiestas();
changeLang(currentLang);
</script>

  }
